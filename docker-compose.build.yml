services:
  # Build APK
  build-apk:
    build:
      context: ./health_pal_frontend
      dockerfile: Dockerfile.apk
    container_name: health_pal_build_apk
    volumes:
      - ./builds/apk:/host_output  # Mount to local directory for external access
    command: >
      sh -c "
        echo 'Starting APK build...' &&
        flutter build apk --release --split-per-abi &&
        echo 'Copying APK files...' &&
        mkdir -p /host_output &&
        cp build/app/outputs/flutter-apk/*.apk /host_output/ &&
        echo 'APK build completed successfully!' &&
        echo 'APK files available in ./builds/apk/ directory' &&
        ls -la /host_output/
      "

  # Build Web
  build-web:
    build:
      context: ./health_pal_frontend
      dockerfile: Dockerfile.web
    container_name: health_pal_build_web
    volumes:
      - ./builds/web:/host_output  # Mount to local directory for external access
    command: >
      sh -c "
        echo 'Starting Web build...' &&
        echo 'Copying Web files...' &&
        mkdir -p /host_output &&
        cp -r build/web/* /host_output/ &&
        echo 'Web build completed successfully!' &&
        echo 'Web files available in ./builds/web/ directory' &&
        ls -la /host_output/
      "

  # Build iOS (simulation)
  build-ios:
    build:
      context: ./health_pal_frontend
      dockerfile: Dockerfile.ios
    container_name: health_pal_build_ios
    volumes:
      - ./builds/ios:/host_output  # Mount to local directory for external access
    command: >
      sh -c "
        echo 'Starting iOS build simulation...' &&
        mkdir -p /host_output &&
        cp /app/ios_info/ios-build-info.txt /host_output/ &&
        echo 'iOS build process completed!' &&
        echo 'iOS info available in ./builds/ios/ directory' &&
        ls -la /host_output/
      "

  # Serve APK builds
  serve-apk:
    image: nginx:alpine
    container_name: health_pal_serve_apk
    ports:
      - "8081:80"
    volumes:
      - ./builds/apk:/usr/share/nginx/html
      - ./nginx/apk.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - build-apk

  # Serve Web builds
  serve-web:
    image: nginx:alpine
    container_name: health_pal_serve_web
    ports:
      - "8083:80"
    volumes:
      - ./builds/web:/usr/share/nginx/html
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - build-web

  # Serve iOS info
  serve-ios:
    image: nginx:alpine
    container_name: health_pal_serve_ios
    ports:
      - "8082:80"
    volumes:
      - ./builds/ios:/usr/share/nginx/html
      - ./nginx/ios.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - build-ios

  # Build Dashboard
  build-dashboard:
    image: nginx:alpine
    container_name: health_pal_build_dashboard
    ports:
      - "8084:80"
    volumes:
      - ./nginx/dashboard.html:/usr/share/nginx/html/index.html
      - ./nginx/dashboard.conf:/etc/nginx/conf.d/default.conf

