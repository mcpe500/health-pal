server {
    listen 80;
    server_name localhost;
    
    location / {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        
        # Serve text files with proper content type
        location ~* \.txt$ {
            add_header Content-Type text/plain;
        }
    }
}