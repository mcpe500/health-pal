name: health_pal_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.2.1 # For Google Sign-In
  http: ^1.2.1 # For making HTTP requests
  flutter_secure_storage: ^9.0.0 # For securely storing JWT
  intl: ^0.19.0 # For date formatting
  flutter_dotenv: ^5.1.0 # For environment variables
  image_picker: ^1.1.2 # For picking images from gallery or camera

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
