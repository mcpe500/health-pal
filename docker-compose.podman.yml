version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: health_pal_mysql_podman
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: health_pal
      MYSQL_USER: health_pal_user
      MYSQL_PASSWORD: health_pal_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_podman_data:/var/lib/mysql
      - ./migration:/docker-entrypoint-initdb.d
    networks:
      - health_pal_podman_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Go Backend
  backend:
    build:
      context: ./health_pal_backend
      dockerfile: Dockerfile
    container_name: health_pal_backend_podman
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=health_pal
      - DB_USER=health_pal_user
      - DB_PASSWORD=health_pal_password
      - JWT_SECRET=your_jwt_secret_key_here
      - GOOGLE_CLIENT_ID=your_google_client_id
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USERNAME=your_email@gmail.com
      - EMAIL_PASSWORD=your_app_password
      - EMAIL_FROM=your_email@gmail.com
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - health_pal_podman_network
    volumes:
      - backend_podman_uploads:/app/uploads

  # Flutter Frontend Development
  frontend-dev:
    build:
      context: ./health_pal_frontend
      dockerfile: Dockerfile
      target: flutter-base
    container_name: health_pal_frontend_podman
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8080
    volumes:
      - ./health_pal_frontend:/app
      - flutter_podman_cache:/root/.pub-cache
    working_dir: /app
    command: flutter run -d web-server --web-hostname 0.0.0.0 --web-port 3000
    depends_on:
      - backend
    networks:
      - health_pal_podman_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: health_pal_nginx_podman
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.podman.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend-dev
    networks:
      - health_pal_podman_network

volumes:
  mysql_podman_data:
  backend_podman_uploads:
  flutter_podman_cache:

networks:
  health_pal_podman_network:
    driver: bridge