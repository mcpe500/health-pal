version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: health-pal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-health_pal}
      MYSQL_USER: ${DB_USER:-health_pal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-health_pal_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migration/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - health-pal-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  backend:
    build:
      context: ./health_pal_backend
      dockerfile: Dockerfile
    container_name: health-pal-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-health_pal_user}
      - DB_PASSWORD=${DB_PASSWORD:-health_pal_password}
      - DB_NAME=${DB_NAME:-health_pal}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your-gemini-api-key}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-your-email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your-app-password}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_uploads:/root/uploads
    networks:
      - health-pal-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Web App
  frontend-web:
    build:
      context: ./health_pal_frontend
      dockerfile: Dockerfile.web
    container_name: health-pal-frontend-web
    restart: unless-stopped
    ports:
      - "3000:8080"
    networks:
      - health-pal-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: health-pal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend-web
    networks:
      - health-pal-network

volumes:
  mysql_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  health-pal-network:
    driver: bridge